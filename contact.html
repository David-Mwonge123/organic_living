<!doctype html>
<html lang="en">
  <head>

    <title>CONTACT US: ORGANIC LIVING</title>

  <body>
    <h2><strong>Please fill out the following form:</strong></h2>
    <form action="">
      <fieldset>
        <legend><strong>Personal Information</strong></legend>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" />
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" />
        <label for="phone number">Phone number:</label>
        <input type="number" name="phone number" id="phone number" />
      </fieldset>
      <fieldset>
        <label for="Taste">Have you tasted our dishes yet?:</label>
        <input type="radio" name="Taste" id="Yes" />
        <label for="Yes">Yes</label>
        <input type="radio" name="Taste" id="No" />
        <label for="No">No</label>
        <br /><br />
        <label for="message">How can we help you?:</label>
        <textarea name="message" id="message" cols="50" rows="10"></textarea>
      </fieldset>
      <br>
      <input type="submit" value="SEND">
      <hr>
      <nav>
        <a href="index.html">Home</a>/
        <a href="menu.html">Our Menu</a>/
        <a href="about.html">About Us</a>
      </nav>
    </form>
